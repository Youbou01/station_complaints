<div class="admin-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="https://agilenergy.com.tn/fr/images/logoagilenergy.jpg" alt="AGIL" class="sidebar-logo" />
      <span class="sidebar-title">Admin Panel</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        Dashboard
      </a>
      <a routerLink="/admin/stations" routerLinkActive="active" class="nav-item">
        Stations
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
        Users
      </a>
      <a routerLink="/admin/complaints" routerLinkActive="active" class="nav-item">
        Complaints
      </a>
    </nav>

    <div class="sidebar-footer">
      @if (authService.currentUser(); as user) {
        <div class="user-info">
          <span class="user-email">{{ user.email }}</span>
          <span class="user-role">{{ user.role }}</span>
        </div>
      }
      <button (click)="logout()" class="logout-btn">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
