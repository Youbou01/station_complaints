<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-left">
      <img src="https://agilenergy.com.tn/fr/images/logoagilenergy.jpg" alt="AGIL Logo" class="header-logo" />
      <h1>Station Complaints</h1>
    </div>
    <div class="header-right">
      @if (authService.currentUser()) {
        <span class="user-info">
          {{ authService.currentUser()?.email }}
          <span class="user-role">{{ authService.currentUser()?.role }}</span>
        </span>
      }
      <button (click)="logout()" class="logout-btn">Logout</button>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="welcome-card">
      <h2>Welcome! 👋</h2>
      @if (authService.currentUser(); as user) {
        <p>You are logged in as <strong>{{ user.email }}</strong></p>
        <p>Your role: <strong class="role-badge">{{ user.role }}</strong></p>
      }
      <p class="coming-soon">Dashboard features coming soon...</p>
    </div>
  </main>
</div>
